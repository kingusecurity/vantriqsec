name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — needed by the gitleaks step below

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Cloudflare Workers types
        run: |
          # worker-configuration.d.ts is gitignored (it's derived partly
          # from .dev.vars, which is per-developer and never committed —
          # see README's "Deploy Checklist" step 4). astro check needs it
          # to resolve `cloudflare:workers`'s env typing, so generate it
          # here from throwaway placeholder values — these never touch
          # git (this .dev.vars is created fresh in the runner's ephemeral
          # filesystem and isn't added to any commit), and only the shape
          # (all string-typed) matters, not the values.
          cat > .dev.vars <<'VARS'
          TURSO_DATABASE_URL=libsql://ci-placeholder.turso.io
          TURSO_AUTH_TOKEN=ci-placeholder-token
          RESEND_API_KEY=re_ci_placeholder
          CONTACT_TO_EMAIL=ci-placeholder@example.com
          CONTACT_TOKEN_SECRET=ci-placeholder-secret-not-real
          VARS
          npx wrangler types

      - run: npx astro check
      - run: npm run build

      - name: Install gitleaks
        run: |
          # Pinned binary download rather than the gitleaks-action wrapper
          # — the wrapper references a GITLEAKS_LICENSE env var for its
          # optional hosted-dashboard integration, which raised the same
          # "might be a paid feature on this plan" question that GitHub's
          # native secret scanning turned out to be. The core gitleaks CLI
          # itself is fully open source with no license gate anywhere in
          # its own --help surface (checked directly) — running the binary
          # ourselves sidesteps the ambiguity entirely.
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          chmod +x gitleaks

      - name: Secret scan — gitleaks (full history)
        run: ./gitleaks git . --log-opts="--all" --redact -v
